version: '3'

vars:
  VERSION: '{{default "dev" .VERSION}}'

tasks:
  default:
    cmds:
      - task --list
  fmt:
    desc: Format Go source
    cmds:
      - gofmt -w assets*.go cmd internal
  fmt:check:
    desc: Check formatting without changing files
    cmds:
      - 'test -z "$(gofmt -l assets*.go cmd internal)"'
  vet:
    desc: Run Go static analysis
    cmds:
      - go vet ./...
  test:
    desc: Run protocol, transport, lifecycle, and operator race tests
    cmds:
      - go test -race -count=1 -timeout=90s ./...
  check:
    desc: Check formatting, static analysis, race tests, and operator configuration
    cmds:
      - task: fmt:check
      - task: vet
      - task: test
      - python3 -m unittest discover -s scripts -p 'test_*.py'
  build:
    desc: Build the current standalone binary, reusing the Go compiler cache
    silent: true
    cmds:
      - mkdir -p bin
      - go build -trimpath -ldflags {{printf "-s -w -X main.version=%s" .VERSION | shellQuote}} -o bin/mcs-bootloader ./cmd/mcs-bootloader
  fuzz:handshake:
    desc: Fuzz handshake framing for 10 seconds
    cmds:
      - go test ./internal/mcproto -run '^$' -fuzz '^FuzzReadHandshake$' -fuzztime=10s -parallel=2
  release:package:
    desc: 'Build checked release binaries locally: task release:package VERSION=v0.5.0 (never publishes)'
    preconditions:
      - sh: python3 scripts/release.py check-version --version {{.VERSION | shellQuote}}
        msg: Supply a stable semantic version such as VERSION=v0.5.0
    cmds:
      - task: check
      - python3 scripts/release.py package --version {{.VERSION | shellQuote}}

  # Every operator task builds first; Go caches unchanged packages.
  # Never interpolate CLI_ARGS: the binary recovers literal Task argv.
  cli:
    desc: 'Run any command: task cli -- config show --json'
    silent: true
    cmds:
      - task: build
      - ./bin/mcs-bootloader _task
  help:
    desc: 'Show CLI help: task help -- command'
    silent: true
    cmds:
      - task: build
      - ./bin/mcs-bootloader _task help
  serve:
    desc: 'Run the gateway in the foreground; normally use its service'
    silent: true
    cmds:
      - task: build
      - ./bin/mcs-bootloader _task serve
  install:
    aliases: [install:binary]
    desc: 'Build and install this executable with its embedded assets'
    silent: true
    cmds:
      - task: build
      - ./bin/mcs-bootloader _task install
  deploy:
    aliases: [deploy:binary]
    desc: 'Build and atomically deploy; leave running processes untouched'
    silent: true
    cmds:
      - task: build
      - ./bin/mcs-bootloader _task deploy
  remove:
    desc: 'Preview removal; pass -- --yes to remove owned files, retaining server and config'
    silent: true
    cmds:
      - task: build
      - ./bin/mcs-bootloader _task remove
  status:
    desc: 'Show state, players, connections and running version'
    silent: true
    cmds:
      - task: build
      - ./bin/mcs-bootloader _task status
  stats:
    desc: 'Show cached telemetry, uptime and boot estimates'
    silent: true
    cmds:
      - task: build
      - ./bin/mcs-bootloader _task stats
  version:
    desc: 'Show source binary version; status shows the running gateway version'
    silent: true
    cmds:
      - task: build
      - ./bin/mcs-bootloader _task version
  metrics:
    desc: 'Inspect cached metrics; use -- --raw for Prometheus or -- --json'
    silent: true
    cmds:
      - task: build
      - ./bin/mcs-bootloader _task metrics
  start:
    aliases: [wake]
    desc: 'Wake Minecraft once; joining also wakes it automatically'
    silent: true
    cmds:
      - task: build
      - ./bin/mcs-bootloader _task start
  stop:
    aliases: [sleep]
    desc: 'Save and stop only when empty; refuse active players or joins'
    silent: true
    cmds:
      - task: build
      - ./bin/mcs-bootloader _task stop
  command:
    desc: 'Send a console command: task command -- op PlayerName'
    silent: true
    cmds:
      - task: build
      - ./bin/mcs-bootloader _task command
  logs:
    desc: 'Show recent gateway events'
    silent: true
    cmds:
      - task: build
      - ./bin/mcs-bootloader _task logs
  logs:follow:
    desc: 'Follow gateway events; Ctrl+C exits the viewer'
    silent: true
    cmds:
      - task: build
      - ./bin/mcs-bootloader _task logs --follow
  logs:server:
    desc: 'Show recent Minecraft console output'
    silent: true
    cmds:
      - task: build
      - ./bin/mcs-bootloader _task logs --server
  logs:server:follow:
    desc: 'Follow Minecraft console output'
    silent: true
    cmds:
      - task: build
      - ./bin/mcs-bootloader _task logs --server --follow
  init:
    desc: 'Create a private .env with a random RCON password; never overwrite'
    silent: true
    cmds:
      - task: build
      - ./bin/mcs-bootloader _task init
  config:
    desc: 'Configuration command group: task config -- show'
    silent: true
    cmds:
      - task: build
      - ./bin/mcs-bootloader _task config
  config:new:
    desc: 'Create a new private configuration from embedded defaults'
    silent: true
    cmds:
      - task: build
      - ./bin/mcs-bootloader _task config new
  config:link:
    aliases: [config:init]
    desc: 'Link a local .env to the installed canonical configuration'
    silent: true
    cmds:
      - task: build
      - ./bin/mcs-bootloader _task config link
  config:edit:
    desc: 'Edit the resolved .env using VISUAL, EDITOR or nano'
    silent: true
    cmds:
      - task: build
      - ./bin/mcs-bootloader _task config edit
  config:show:
    desc: 'Show desired settings with the password redacted'
    silent: true
    cmds:
      - task: build
      - ./bin/mcs-bootloader _task config show
  config:live:
    desc: 'Show applied settings with the password redacted'
    silent: true
    cmds:
      - task: build
      - ./bin/mcs-bootloader _task config live
  config:check:
    desc: 'Validate settings and service-account access'
    silent: true
    cmds:
      - task: build
      - ./bin/mcs-bootloader _task config check
  config:reload:
    aliases: [reload, config:apply]
    desc: 'Atomically re-read .env over the socket: task config:reload -- .env'
    silent: true
    cmds:
      - task: build
      - ./bin/mcs-bootloader _task config reload
  gateway:
    desc: 'Gateway command group: task gateway -- restart'
    silent: true
    cmds:
      - task: build
      - ./bin/mcs-bootloader _task gateway
  gateway:start:
    desc: 'Start the gateway and wake monitoring'
    silent: true
    cmds:
      - task: build
      - ./bin/mcs-bootloader _task gateway start
  gateway:configure:
    desc: 'Refresh gateway service settings without restarting processes'
    silent: true
    cmds:
      - task: build
      - ./bin/mcs-bootloader _task gateway configure
  gateway:stop:
    desc: 'Stop public access and wake monitoring; Java stays running'
    silent: true
    cmds:
      - task: build
      - ./bin/mcs-bootloader _task gateway stop
  gateway:restart:
    desc: 'Restart the gateway after preflight; disconnect clients, keep Java running'
    silent: true
    cmds:
      - task: build
      - ./bin/mcs-bootloader _task gateway restart
  config:validate:
    desc: 'Internal config validation helper; normally use config:check'
    silent: true
    cmds:
      - task: build
      - ./bin/mcs-bootloader _task check
  restart-check:
    desc: 'Internal restart preflight; normally use gateway:restart'
    silent: true
    cmds:
      - task: build
      - ./bin/mcs-bootloader _task restart-check
  backend-start:
    desc: 'Systemd launch helper; normally use start'
    silent: true
    cmds:
      - task: build
      - ./bin/mcs-bootloader _task backend-start
  backend-stop:
    desc: 'Systemd stop helper with --pid; normally use stop'
    silent: true
    cmds:
      - task: build
      - ./bin/mcs-bootloader _task backend-stop
