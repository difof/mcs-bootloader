version: '3'

vars:
  VERSION: '{{default "dev" .VERSION}}'

tasks:
  default:
    cmds:
      - task --list
  fmt:
    desc: Format Go source
    cmds:
      - gofmt -w cmd internal
  fmt:check:
    desc: Check formatting without changing files
    cmds:
      - 'test -z "$(gofmt -l cmd internal)"'
  vet:
    desc: Run Go static analysis
    cmds:
      - go vet ./...
  test:
    desc: Run protocol, transport, lifecycle, and operator race tests
    cmds:
      - go test -race -count=1 -timeout=90s ./...
  check:
    desc: Check formatting, static analysis, race tests, and operator configuration
    cmds:
      - task: fmt:check
      - task: vet
      - task: test
      - python3 -m unittest discover -s scripts -p 'test_*.py'
  build:
    desc: Build the daemon and local admin/command client
    cmds:
      - mkdir -p bin
      - go build -trimpath -ldflags {{printf "-s -w -X main.version=%s" .VERSION | shellQuote}} -o bin/mcs-bootloader ./cmd/mcs-bootloader
  fuzz:handshake:
    desc: Fuzz handshake framing for 10 seconds
    cmds:
      - go test ./internal/mcproto -run '^$' -fuzz '^FuzzReadHandshake$' -fuzztime=10s -parallel=2
  install:
    desc: Check and build source, then install against a stopped and backed-up server
    cmds:
      - task: check
      - task: build
      - task: install:binary
  install:binary:
    desc: Install the bundled binary; verify a stopped server and backup (no Go needed)
    cmds:
      - mkdir -p .local
      - sudo -n python3 scripts/install.py --env .env
      - task: config:init
  backup:
    desc: Create and verify a complete first-install backup while Minecraft is stopped
    cmds:
      - mkdir -p .local
      - sudo -n python3 scripts/install.py --env .env --backup
  deploy:
    desc: Check, build, and install an update; leave running gateway and Java untouched
    cmds:
      - task: check
      - task: build
      - task: deploy:binary
  deploy:binary:
    desc: Install a bundled update without rebuilding or restarting either service
    cmds:
      - python3 scripts/manage.py deploy
  release:package:
    desc: 'Check and package both Linux architectures locally: task release:package VERSION=v0.3.0 (never tags or publishes)'
    preconditions:
      - sh: python3 scripts/release.py check-version --version {{.VERSION | shellQuote}}
        msg: Supply a stable semantic version such as VERSION=v0.3.0
    cmds:
      - task: check
      - python3 scripts/release.py package --version {{.VERSION | shellQuote}}
  status:
    desc: Show Minecraft state, player health, connections, and gateway version
    silent: true
    cmds:
      - python3 scripts/manage.py status {{.CLI_ARGS}}
  version:
    desc: Show the installed executable version (running daemon version is in status)
    silent: true
    cmds:
      - python3 scripts/manage.py version {{.CLI_ARGS}}
  start:
    aliases: [wake]
    desc: Start Minecraft once; joining also wakes it automatically
    silent: true
    cmds:
      - python3 scripts/manage.py start {{.CLI_ARGS}}
  stop:
    aliases: [sleep]
    desc: Save and stop when empty; refuses active players/joins; future login wakes it
    silent: true
    cmds:
      - python3 scripts/manage.py stop {{.CLI_ARGS}}
  command:
    desc: 'Send a console command through the private socket: task command -- op PlayerName'
    silent: true
    cmds:
      - python3 scripts/manage.py command --task-args
  logs:
    desc: Show recent gateway state and connection events
    silent: true
    cmds:
      - python3 scripts/manage.py logs {{.CLI_ARGS}}
  logs:follow:
    desc: Follow gateway events (Ctrl+C exits the viewer)
    silent: true
    cmds:
      - python3 scripts/manage.py logs-follow {{.CLI_ARGS}}
  logs:server:
    desc: Show recent Minecraft console output
    silent: true
    cmds:
      - python3 scripts/manage.py logs-server {{.CLI_ARGS}}
  logs:server:follow:
    desc: Follow Minecraft console output (Ctrl+C exits the viewer)
    silent: true
    cmds:
      - python3 scripts/manage.py logs-server-follow {{.CLI_ARGS}}
  config:new:
    desc: Create a private .env example with a random RCON password; never overwrite
    silent: true
    cmds:
      - python3 scripts/manage.py config-new
  config:init:
    desc: Link project .env to the installed canonical file without copying secrets
    silent: true
    cmds:
      - python3 scripts/manage.py config-init {{.CLI_ARGS}}
  config:edit:
    desc: Edit the canonical .env using VISUAL, EDITOR, or nano
    silent: true
    cmds:
      - python3 scripts/manage.py config-edit {{.CLI_ARGS}}
  config:show:
    desc: Show .env settings and defaults with the password redacted
    silent: true
    cmds:
      - python3 scripts/manage.py config-show {{.CLI_ARGS}}
  config:live:
    desc: Show the daemon's applied settings and generation with the password redacted
    silent: true
    cmds:
      - python3 scripts/manage.py config-live {{.CLI_ARGS}}
  config:check:
    desc: Validate canonical .env and service-account access without changing files or services
    silent: true
    cmds:
      - python3 scripts/manage.py config-check {{.CLI_ARGS}}
  config:apply:
    aliases: [reload]
    desc: Apply supported .env changes through the control socket without restarting
    silent: true
    cmds:
      - python3 scripts/manage.py config-apply {{.CLI_ARGS}}
  gateway:start:
    desc: Start the gateway service (does not directly start Minecraft)
    silent: true
    cmds:
      - python3 scripts/manage.py gateway-start {{.CLI_ARGS}}
  gateway:stop:
    desc: Stop gateway and disconnect clients; leave Java running; disables wake until started
    silent: true
    cmds:
      - python3 scripts/manage.py gateway-stop {{.CLI_ARGS}}
  gateway:restart:
    desc: Restart gateway after a code update; disconnect clients; leave Java running
    silent: true
    cmds:
      - python3 scripts/manage.py gateway-restart {{.CLI_ARGS}}
