version: '3'

vars:
  VERSION: '{{default "dev" .VERSION}}'

tasks:
  default:
    cmds:
      - task --list
  fmt:
    desc: Format Go source
    cmds:
      - gofmt -w assets*.go cmd internal
  fmt:check:
    desc: Check formatting without changing files
    cmds:
      - 'test -z "$(gofmt -l assets*.go cmd internal)"'
  vet:
    desc: Run Go static analysis
    cmds:
      - go vet ./...
  test:
    desc: Run protocol, transport, lifecycle, and operator race tests
    cmds:
      - go test -race -count=1 -timeout=90s ./...
  check:
    desc: Check formatting, static analysis, race tests, and operator configuration
    cmds:
      - task: fmt:check
      - task: vet
      - task: test
      - python3 -m unittest discover -s scripts -p 'test_*.py'
  build:
    desc: Build the standalone daemon and operator CLI
    cmds:
      - mkdir -p bin
      - go build -trimpath -ldflags {{printf "-s -w -X main.version=%s" .VERSION | shellQuote}} -o bin/mcs-bootloader ./cmd/mcs-bootloader
  fuzz:handshake:
    desc: Fuzz handshake framing for 10 seconds
    cmds:
      - go test ./internal/mcproto -run '^$' -fuzz '^FuzzReadHandshake$' -fuzztime=10s -parallel=2
  install:
    desc: Check/build, then install against a stopped and backed-up server
    cmds:
      - task: check
      - task: build
      - task: install:binary
  deploy:
    desc: Check/build, then atomically install an update; restart explicitly
    cmds:
      - task: check
      - task: build
      - task: deploy:binary
  release:package:
    desc: 'Check/build standalone release binaries locally: task release:package VERSION=v0.5.0 (never publishes)'
    preconditions:
      - sh: python3 scripts/release.py check-version --version {{.VERSION | shellQuote}}
        msg: Supply a stable semantic version such as VERSION=v0.5.0
    cmds:
      - task: check
      - python3 scripts/release.py package --version {{.VERSION | shellQuote}}
  cli:
    desc: 'Run any binary command: task cli -- config show --json'
    silent: true
    preconditions:
      - sh: test -x ./bin/mcs-bootloader
        msg: Run task build first; operator tasks call the built executable.
    cmds:
      - ./bin/mcs-bootloader _task
  install:binary:
    desc: 'Install using the built executable and its embedded assets'
    silent: true
    preconditions:
      - sh: test -x ./bin/mcs-bootloader
        msg: Run task build first; operator tasks call the built executable.
    cmds:
      - ./bin/mcs-bootloader _task install
  backup:
    desc: 'Create and verify a complete first-install backup while Minecraft is stopped'
    silent: true
    preconditions:
      - sh: test -x ./bin/mcs-bootloader
        msg: Run task build first; operator tasks call the built executable.
    cmds:
      - ./bin/mcs-bootloader _task backup
  deploy:binary:
    desc: 'Atomically deploy the built executable; leave running processes untouched'
    silent: true
    preconditions:
      - sh: test -x ./bin/mcs-bootloader
        msg: Run task build first; operator tasks call the built executable.
    cmds:
      - ./bin/mcs-bootloader _task deploy
  remove:
    desc: 'Preview removal; pass -- --yes to remove owned service files, retaining server and config'
    silent: true
    preconditions:
      - sh: test -x ./bin/mcs-bootloader
        msg: Run task build first; operator tasks call the built executable.
    cmds:
      - ./bin/mcs-bootloader _task remove
  status:
    desc: 'Show state, players, connections and version'
    silent: true
    preconditions:
      - sh: test -x ./bin/mcs-bootloader
        msg: Run task build first; operator tasks call the built executable.
    cmds:
      - ./bin/mcs-bootloader _task status
  stats:
    desc: 'Show cached telemetry as a readable summary'
    silent: true
    preconditions:
      - sh: test -x ./bin/mcs-bootloader
        msg: Run task build first; operator tasks call the built executable.
    cmds:
      - ./bin/mcs-bootloader _task stats
  version:
    desc: 'Show the built executable version; status shows the running daemon version'
    silent: true
    preconditions:
      - sh: test -x ./bin/mcs-bootloader
        msg: Run task build first; operator tasks call the built executable.
    cmds:
      - ./bin/mcs-bootloader _task version
  metrics:
    desc: 'Inspect cached metrics; use -- --raw for Prometheus or -- --json'
    silent: true
    preconditions:
      - sh: test -x ./bin/mcs-bootloader
        msg: Run task build first; operator tasks call the built executable.
    cmds:
      - ./bin/mcs-bootloader _task metrics
  start:
    aliases: [wake]
    desc: 'Wake Minecraft once; joining also wakes it automatically'
    silent: true
    preconditions:
      - sh: test -x ./bin/mcs-bootloader
        msg: Run task build first; operator tasks call the built executable.
    cmds:
      - ./bin/mcs-bootloader _task start
  stop:
    aliases: [sleep]
    desc: 'Save and stop only when empty; refuse active players or joins'
    silent: true
    preconditions:
      - sh: test -x ./bin/mcs-bootloader
        msg: Run task build first; operator tasks call the built executable.
    cmds:
      - ./bin/mcs-bootloader _task stop
  command:
    desc: 'Send a console command: task command -- op PlayerName'
    silent: true
    preconditions:
      - sh: test -x ./bin/mcs-bootloader
        msg: Run task build first; operator tasks call the built executable.
    cmds:
      - ./bin/mcs-bootloader _task command
  logs:
    desc: 'Show recent gateway events'
    silent: true
    preconditions:
      - sh: test -x ./bin/mcs-bootloader
        msg: Run task build first; operator tasks call the built executable.
    cmds:
      - ./bin/mcs-bootloader _task logs
  logs:follow:
    desc: 'Follow gateway events; Ctrl+C exits the viewer'
    silent: true
    preconditions:
      - sh: test -x ./bin/mcs-bootloader
        msg: Run task build first; operator tasks call the built executable.
    cmds:
      - ./bin/mcs-bootloader _task logs --follow
  logs:server:
    desc: 'Show recent Minecraft console output'
    silent: true
    preconditions:
      - sh: test -x ./bin/mcs-bootloader
        msg: Run task build first; operator tasks call the built executable.
    cmds:
      - ./bin/mcs-bootloader _task logs --server
  logs:server:follow:
    desc: 'Follow Minecraft console output'
    silent: true
    preconditions:
      - sh: test -x ./bin/mcs-bootloader
        msg: Run task build first; operator tasks call the built executable.
    cmds:
      - ./bin/mcs-bootloader _task logs --server --follow
  config:new:
    desc: 'Create a private .env with a random RCON password; never overwrite'
    silent: true
    preconditions:
      - sh: test -x ./bin/mcs-bootloader
        msg: Run task build first; operator tasks call the built executable.
    cmds:
      - ./bin/mcs-bootloader _task config new
  init:
    desc: 'Create the initial private configuration from embedded defaults'
    silent: true
    preconditions:
      - sh: test -x ./bin/mcs-bootloader
        msg: Run task build first; operator tasks call the built executable.
    cmds:
      - ./bin/mcs-bootloader _task init
  config:init:
    desc: 'Link local .env to the installed canonical configuration'
    silent: true
    preconditions:
      - sh: test -x ./bin/mcs-bootloader
        msg: Run task build first; operator tasks call the built executable.
    cmds:
      - ./bin/mcs-bootloader _task config link
  config:edit:
    desc: 'Edit the canonical .env using VISUAL, EDITOR or nano'
    silent: true
    preconditions:
      - sh: test -x ./bin/mcs-bootloader
        msg: Run task build first; operator tasks call the built executable.
    cmds:
      - ./bin/mcs-bootloader _task config edit
  config:show:
    desc: 'Show desired settings with the password redacted'
    silent: true
    preconditions:
      - sh: test -x ./bin/mcs-bootloader
        msg: Run task build first; operator tasks call the built executable.
    cmds:
      - ./bin/mcs-bootloader _task config show
  config:live:
    desc: 'Show applied settings with the password redacted'
    silent: true
    preconditions:
      - sh: test -x ./bin/mcs-bootloader
        msg: Run task build first; operator tasks call the built executable.
    cmds:
      - ./bin/mcs-bootloader _task config live
  config:check:
    desc: 'Validate settings and service-account access'
    silent: true
    preconditions:
      - sh: test -x ./bin/mcs-bootloader
        msg: Run task build first; operator tasks call the built executable.
    cmds:
      - ./bin/mcs-bootloader _task config check
  config:reload:
    aliases: [reload]
    desc: 'Atomically re-read .env over the socket: task config:reload -- .env'
    silent: true
    preconditions:
      - sh: test -x ./bin/mcs-bootloader
        msg: Run task build first; operator tasks call the built executable.
    cmds:
      - ./bin/mcs-bootloader _task config reload
  config:apply:
    desc: 'Compatibility alias for config:reload'
    silent: true
    preconditions:
      - sh: test -x ./bin/mcs-bootloader
        msg: Run task build first; operator tasks call the built executable.
    cmds:
      - ./bin/mcs-bootloader _task config reload
  gateway:start:
    desc: 'Start the gateway and wake monitoring'
    silent: true
    preconditions:
      - sh: test -x ./bin/mcs-bootloader
        msg: Run task build first; operator tasks call the built executable.
    cmds:
      - ./bin/mcs-bootloader _task gateway start
  gateway:configure:
    desc: 'Refresh gateway service settings without restarting processes'
    silent: true
    preconditions:
      - sh: test -x ./bin/mcs-bootloader
        msg: Run task build first; operator tasks call the built executable.
    cmds:
      - ./bin/mcs-bootloader _task gateway configure
  gateway:stop:
    desc: 'Stop public access and wake monitoring; Java stays running'
    silent: true
    preconditions:
      - sh: test -x ./bin/mcs-bootloader
        msg: Run task build first; operator tasks call the built executable.
    cmds:
      - ./bin/mcs-bootloader _task gateway stop
  gateway:restart:
    desc: 'Restart the gateway after preflight; disconnect clients, keep Java running'
    silent: true
    preconditions:
      - sh: test -x ./bin/mcs-bootloader
        msg: Run task build first; operator tasks call the built executable.
    cmds:
      - ./bin/mcs-bootloader _task gateway restart
